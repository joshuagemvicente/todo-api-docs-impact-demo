name: Documentation impact

on:
  pull_request:
    paths: [openapi.json, 'docs/**']

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find changed documentation
        id: changed
        run: echo "files=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | paste -sd, -)" >> "$GITHUB_OUTPUT"
      - name: Check mapped documentation
        run: |
          git show ${{ github.event.pull_request.base.sha }}:openapi.json > "$RUNNER_TEMP/openapi.before.json"
          CHANGED_FILES="${{ steps.changed.outputs.files }}" node scripts/check-doc-impact.mjs "$RUNNER_TEMP/openapi.before.json" openapi.json
